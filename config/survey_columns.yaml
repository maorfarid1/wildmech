# Column maps for the Leo annual ME surveys (Google Forms exports, sheet "Form Responses 1").
# Mapped by position, with a header-prefix check so a re-ordered export fails loudly.
# PII columns are dropped on load and never written anywhere.

pain_scale_note: >
  Items ask "how much do you suffer from / enjoy this?" on 1-5 with 3 = neutral.
  Form anchors (verified from screenshots of the Google Form): 1 = enjoy very much, 5 = suffer very much.
  pain = raw score.

time_units_minutes:   # working-time conversion
  "דקות": 1
  "שעות": 60
  "ימים": 480        # 8 h working day
  "שבועות": 2400     # 5 working days
  "חודשים": 10080    # 21 working days
censored_value: "יותר מ-50"   # "more than 50" -> 50, flagged as right-censored

"2024":
  expected_rows: 556
  pii: [1, 8]                 # email, salary
  drop: [10, 15, 20, 25, 35, 38, 43, 45, 46, 47, 48, 49, 50, 51, 52, 53]  # notes / marketing / empty
