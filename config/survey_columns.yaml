    component_search_catalog: {label: "Search for a component in supplier catalogs", times: 16, pain: 17, dur: 18, unit: 19, prefix_dur: "כמה זמן זה לוקח לך? \n[חיפוש של רכיב אחד]"}
    model_catalog_part:     {label: "Model a catalog part yourself in CAD", times: 21, pain: 22, dur: 23, unit: 24, prefix_dur: "כמה זמן זה לוקח לך? \n[מידול של רכיב אחד]"}
    answer_engineering_question: {label: "Find the answer to an engineering question", times: 26, pain: 27, dur: 28, unit: 29, prefix_dur: "כמה זמן זה לוקח לך? \n[מציאת תשובה לשאלה טיפוסית]"}
    convert_mfg_method:     {label: "Convert a part design to another manufacturing method", times: 39, pain: 40, dur: 41, unit: 42, prefix_dur: "כמה זמן זה לוקח לך? \n[המרה של חלק אחד]"}
  binary_tasks:
    design_to_org_rules:    {label: "Design to company rules and preferences", applies: 31, pain: 32}
    design_to_standards:    {label: "Design to external standards (ISO, MIL, SAE, EN)", applies: 33, pain: 34}
    elegant_design_emphasis: {label: "Meet an emphasis on elegant design", applies: 36, pain: 37}

